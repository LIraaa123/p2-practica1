<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Tienda Mínima SQL</title>
  <style>
    body { font-family: sans-serif; max-width: 450px; margin: 20px auto; padding: 10px; }
    form { border: 1px solid #ccc; padding: 15px; margin-bottom: 15px; border-radius: 5px; }
    input, select, button { display: block; width: 100%; margin: 8px 0; padding: 8px; box-sizing: border-box; }
    button { background: #007bff; color: white; border: none; cursor: pointer; }
  </style>
</head>
<body>
  <h2>Tienda en Línea</h2>
  <div id="log" style="color: blue; font-weight: bold; margin-bottom: 10px;"></div>

  <!-- 1. Autenticación -->
  <form>
    <h3>1. Iniciar Sesión / Registro</h3>
    <input type="text" id="user" placeholder="Usuario" required>
    <input type="password" id="pass" placeholder="Contraseña" required>
    <button type="button" onclick="ejecutarSQL('REGISTRO')">Registrar (INSERT)</button>
    <button type="button" onclick="ejecutarSQL('LOGIN')">Iniciar Sesión (SELECT)</button>
  </form>

  <!-- 2. Formulario de Venta -->
  <form>
    <h3>2. Formulario de Venta</h3>
    <label>Categoría:</label>
    <select id="cat">
      <option>Ropa</option>
      <option>Cosméticos</option>
      <option>Calzado</option>
      <option>Celulares</option>
    </select>

    <label>Marca:</label>
    <select id="marca">
      <option>Nike</option><option>Adidas</option>
      <option>Apple</option><option>Samsung</option><option>L'Oréal</option>
    </select>

    <input type="text" id="prod" placeholder="Nombre del Producto" required>
    <input type="number" id="precio" placeholder="Precio ($)" required>
    <button type="button" onclick="ejecutarSQL('VENTA')">Guardar Venta (INSERT)</button>
  </form>

  <script>
    function ejecutarSQL(tipo) {
      const u = document.getElementById('user').value, p = document.getElementById('pass').value;
      const c = document.getElementById('cat').value, m = document.getElementById('marca').value;
      const pr = document.getElementById('prod').value, px = document.getElementById('precio').value;
      let sql = "";

      if (tipo === 'REGISTRO') sql = `INSERT INTO usuarios VALUES ('${u}', '${p}');`;
      if (tipo === 'LOGIN') sql = `SELECT * FROM usuarios WHERE user='${u}' AND pass='${p}';`;
      if (tipo === 'VENTA') sql = `INSERT INTO ventas VALUES ('${c}', '${m}', '${pr}', ${px});`;

      document.getElementById('log').innerText = "SQL Ejecutado: " + sql;
    }
  </script>
</body>
</html>
